experiment:
  name: parseq_baseline
  task: recognition
  paths_config: configs/paths/remote_server.yaml
runtime:
  device: cuda
  allow_cpu: false
data:
  image_height: 256
  image_width: 128
  sequence_axis: height
  batch_size: 64
  num_workers: 8
  augmentation:
    enabled: true
    rotation_degrees: 0.5
    translate_ratio: 0.008
    scale_min: 0.985
    scale_max: 1.015
    brightness: 0.04
    contrast: 0.04
model:
  name: PARSeqCTCRecognizer
  in_channels: 3
  embed_dim: 384
  patch_size:
  - 2
  - 16
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.04
  max_seq_len: 512
  sequence_axis: height
  pooling_type: attention
loss:
  blank_idx: 0
  zero_infinity: true
  use_orthographic_loss: false
  use_alignment_loss: false
  lambda_align: 0.0
  lambda_align_final: 0.0
  lambda_align_decay_start_epoch: 0
  lambda_align_decay_end_epoch: 0
  align_label_smoothing: 0.0
decode:
  use_lexicon: true
  lexicon_source: train
  max_edit_distance: 2
  length_delta: 2
  min_word_length: 2
  use_ctc_lexicon_rerank: true
  ctc_rerank_max_edit_distance: 2
  ctc_rerank_length_delta: 2
  ctc_rerank_min_word_length: 2
  ctc_rerank_max_candidates: 40
  ctc_rerank_prior_weight: 0.04
train:
  epochs: 200
  lr: 1.2e-05
  min_lr: 3.0e-06
  weight_decay: 1.0e-05
  amp: true
  seed: 42
  log_interval: 100
  val_interval: 50
  rerank_val_interval: 50
  validate_during_training: true
  grad_accum_steps: 2
  warmup_epochs: 20
  scheduler: cosine
  grad_clip_norm: 0.3
  early_stop_patience: 0
  use_ema: true
  ema_decay: 0.9995
  channels_last: true
  cudnn_benchmark: true
  allow_tf32: true
  best_metric: ctc_rerank_word_accuracy
