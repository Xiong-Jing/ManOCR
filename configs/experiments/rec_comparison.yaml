experiment:
  name: "rec_comparison"
  task: "recognition_comparison"

models:
  - name: "CRNN"
    source: "internal"
    config: "configs/recognition/crnn_baseline.yaml"
    checkpoint: "outputs/checkpoints/recognition/crnn_baseline/best.pth"
  - name: "PARSeq"
    source: "internal"
    config: "configs/recognition/parseq_baseline.yaml"
    checkpoint: "outputs/checkpoints/recognition/parseq_baseline/best.pth"
  - name: "ABINet"
    source: "internal"
    config: "configs/recognition/abinet_baseline.yaml"
    checkpoint: "outputs/checkpoints/recognition/abinet_baseline/best.pth"
  - name: "SVTRv2"
    source: "internal"
    config: "configs/recognition/svtrv2_baseline.yaml"
    checkpoint: "outputs/checkpoints/recognition/svtrv2_baseline/best.pth"
  - name: "SVTRv2 + NRTR"
    source: "internal"
    config: "configs/recognition/svtrv2_nrtr_baseline.yaml"
    checkpoint: "outputs/checkpoints/recognition/svtrv2_nrtr_baseline/best.pth"
  - name: "DCM"
    source: "internal"
    config: "configs/recognition/dcm_baseline.yaml"
    checkpoint: "outputs/checkpoints/recognition/dcm_baseline/best.pth"
  - name: "Ours (SVTR + DAB + OTP)"
    source: "internal"
    config: "configs/recognition/svtr_official_dab_lortho.yaml"
    checkpoint: "outputs/checkpoints/recognition/svtr_official_dab_lortho/best.pth"

workflow:
  script: "scripts/run_rec_comparison.sh"
  summary_script: "tools/summarize_recognition_comparison.py"
  output_markdown: "outputs/metrics/recognition/recognition_comparison.md"
  output_json: "outputs/metrics/recognition/recognition_comparison.json"
