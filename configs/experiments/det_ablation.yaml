experiment:
  name: "det_ablation"
  task: "detection_ablation"

experiments:
  - name: "dbnetpp_official_baseline"
    config: "configs/detection/dbnetpp_official_baseline.yaml"
  - name: "dbnetpp_vsaa"
    config: "configs/detection/dbnetpp_vsaa.yaml"
  - name: "dbnetpp_asym_shrink"
    config: "configs/detection/dbnetpp_asym_shrink.yaml"
  - name: "dbnetpp_vsaa_asym_shrink"
    config: "configs/detection/dbnetpp_vsaa_asym_shrink.yaml"

workflow:
  train_script: "scripts/train_detection.py"
  eval_script: "scripts/eval_detection.py"
  checkpoint_name: "best.pth"
  eval_splits: ["val", "test"]
  summary_script: "tools/summarize_detection_formal.py"
  plot_script: "tools/plot_detection_formal_curves.py"
