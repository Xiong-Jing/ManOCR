experiment:
  name: "full_ocr_best"
  task: "full_ocr_inference"

detection:
  config: "configs/detection/dbnetpp_vsaa_asym_shrink.yaml"
  checkpoint: "outputs/checkpoints/detection/dbnetpp_vsaa_asym_shrink/best.pth"

recognition:
  config: "configs/recognition/svtr_official_dab_lortho.yaml"
  checkpoint: "outputs/checkpoints/recognition/svtr_official_dab_lortho/best.pth"

data:
  input: "full_ocr_workspace/input"

inference:
  script: "scripts/infer_full_ocr.py"
  output_json: "full_ocr_workspace/full_page_predictions.json"
  text_output_dir: "full_ocr_workspace/page_texts"
  annotated_output_dir: "full_ocr_workspace/annotated"
  sequence_output_dir: "full_ocr_workspace/sequence"
  combined_output_dir: "full_ocr_workspace/combined"
  crop_padding: 4
  crop_padding_ratio: 0.04
