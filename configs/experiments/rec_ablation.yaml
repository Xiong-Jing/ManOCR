experiment:
  name: "rec_ablation"
  task: "recognition_ablation"

experiments:
  - name: "svtr_official_baseline"
    config: "configs/recognition/svtr_official_baseline.yaml"
  - name: "svtr_official_dab"
    config: "configs/recognition/svtr_official_dab.yaml"
  - name: "svtr_official_lortho"
    config: "configs/recognition/svtr_official_lortho.yaml"
  - name: "svtr_official_dab_lortho"
    config: "configs/recognition/svtr_official_dab_lortho.yaml"

workflow:
  train_script: "scripts/train_recognition.py"
  eval_script: "scripts/eval_recognition.py"
  checkpoint_name: "best.pth"
  eval_splits: ["val", "test"]
  summary_script: "tools/summarize_recognition_formal.py"
  plot_script: "tools/plot_recognition_formal_curves.py"
