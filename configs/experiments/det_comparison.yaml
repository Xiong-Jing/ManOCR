experiment:
  name: "det_comparison"
  task: "detection_comparison"

models:
  - name: "EAST"
    source: "internal"
    config: "configs/detection/east_baseline.yaml"
    checkpoint: "outputs/checkpoints/detection/east_baseline/best.pth"
  - name: "CRAFT"
    source: "internal"
    config: "configs/detection/craft_baseline.yaml"
    checkpoint: "outputs/checkpoints/detection/craft_baseline/best.pth"
  - name: "DBNet"
    source: "internal"
    config: "configs/detection/dbnet_baseline.yaml"
    checkpoint: "outputs/checkpoints/detection/dbnet_baseline/best.pth"
  - name: "PP-OCRv5 Det"
    source: "internal"
    config: "configs/detection/ppocrv5_det_baseline.yaml"
    checkpoint: "outputs/checkpoints/detection/ppocrv5_det_baseline/best.pth"
  - name: "Hi-SAM"
    source: "internal"
    config: "configs/detection/hisam_baseline.yaml"
    checkpoint: "outputs/checkpoints/detection/hisam_baseline/best.pth"
  - name: "Ours (DBNet++ + VSAA + AS)"
    source: "internal"
    config: "configs/detection/dbnetpp_vsaa_asym_shrink.yaml"
    checkpoint: "outputs/checkpoints/detection/dbnetpp_vsaa_asym_shrink/best.pth"

workflow:
  script: "scripts/run_det_comparison.sh"
  summary_script: "tools/summarize_detection_comparison.py"
  output_markdown: "outputs/metrics/detection/detection_comparison_strict.md"
  output_json: "outputs/metrics/detection/detection_comparison_strict.json"
